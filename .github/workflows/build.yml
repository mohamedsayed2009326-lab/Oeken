name: Build APK from zip
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q plates-manager-project.zip
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - working-directory: plates-manager
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android
          sed -i 's/<application/<application android:allowBackup="true"/' android/app/src/main/AndroidManifest.xml
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: plates-manager-apk
          path: plates-manager/android/app/build/outputs/apk/debug/app-debug.apk
